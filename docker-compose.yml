services:
  llama-server:
    build: 
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - http_proxy=${http_proxy}
        - https_proxy=${https_proxy}
    container_name: llama-cpp-server
    ports:
      - "9000:8000"
    # Model downloaded directly in container, no volume mapping needed
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=*
      - no_proxy=*
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    runtime: nvidia 
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llm.rule=Host(`caronboulme.fr`) && PathPrefix(`/llm`)"
      - "traefik.http.routers.llm.entrypoints=websecure"
      - "traefik.http.routers.llm.tls.certresolver=letsencrypt"
      - "traefik.http.services.llm.loadbalancer.server.port=8000"
      - "traefik.http.routers.llm.priority=200"
      - "traefik.http.routers.llm.middlewares=llm-stripprefix"
      - "traefik.http.middlewares.llm-stripprefix.stripprefix.prefixes=/llm"
    networks:
      - unmute_default

networks:
  unmute_default:
    external: true